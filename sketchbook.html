<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketchbook – Maj Vestal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <script>
      try { localStorage.setItem("mv_aesthetic", "neo"); } catch (e) {}
    </script>
    <script src="./theme.js?v=4"></script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme-neo.css?v=24" />
    <link rel="stylesheet" href="https://use.typekit.net/cyu8ase.css" />
    <script>
      (function () {
        var m = sessionStorage.getItem("mv_portfolio");
        if (m !== "full") {
          window.location.replace(m === "locked" ? "misc.html" : "index.html");
        }
      })();
    </script>
  </head>
  <body class="neo-personal neo-shelf">
    <nav class="nav" aria-label="Leave this room">
      <a class="nav-link neo-back" href="fun.html">back to home</a>
    </nav>
    <main class="shelf">
      <h1 class="shelf-title">Sketchbook</h1>
      <div class="sketch-stage">
        <div class="sketch-flip" id="sketch-book"></div>
        <div class="sketch-controls">
          <button type="button" id="sketch-prev">Prev</button>
          <span id="sketch-count">2 / 8</span>
          <button type="button" id="sketch-next">Next</button>
        </div>
        <p class="sketch-hint">Hover a corner and the page lifts. Drag to bend it, or click the edge.</p>
      </div>
    </main>
    <script src="./scripts/page-flip.browser.js"></script>
    <script>
      (function () {
        // Drop page images in here, in order, when the book is ready:
        // "assets/sketchbook/01.jpg",
        var PAGES = [
          "assets/misc/Drawings/figure%20drawing.png",
          "assets/misc/Drawings/figure2.png",
          "assets/misc/Drawings/figure6.png"
        ];
        var BLANKS = 8;

        var sources = PAGES.length
          ? PAGES.slice()
          : Array.from({ length: BLANKS }, function (_, i) { return null; });
        if (sources.length % 2) sources.push(null);

        var book = document.getElementById("sketch-book");
        var count = document.getElementById("sketch-count");
        var prevBtn = document.getElementById("sketch-prev");
        var nextBtn = document.getElementById("sketch-next");
        var sheets = sources.map(function (src, i) {
          var page = document.createElement("div");
          page.className = "sketch-sheet";
          if (src) {
            var img = document.createElement("img");
            img.src = src;
            img.alt = "Sketchbook page " + (i + 1);
            page.appendChild(img);
          } else {
            var label = document.createElement("span");
            label.textContent = String(i + 1);
            page.appendChild(label);
          }
          return page;
        });

        var flip = new St.PageFlip(book, {
          width: 460,
          height: 620,
          size: "stretch",
          minWidth: 260,
          maxWidth: 520,
          minHeight: 360,
          maxHeight: 680,
          usePortrait: false,
          showCover: false,
          drawShadow: true,
          maxShadowOpacity: 0.55,
          flippingTime: 800,
          showPageCorners: true,
          mobileScrollSupport: false,
          autoSize: true,
          startZIndex: 2
        });
        flip.loadFromHTML(sheets);

        function paint() {
          var index = flip.getCurrentPageIndex();
          var total = flip.getPageCount();
          var shown = Math.min(index + 2, total);
          count.textContent = shown + " / " + total;
          prevBtn.disabled = index <= 0;
          nextBtn.disabled = index >= total - 2;
        }

        flip.on("flip", paint);
        prevBtn.addEventListener("click", function () { flip.flipPrev("bottom"); });
        nextBtn.addEventListener("click", function () { flip.flipNext("bottom"); });
        document.addEventListener("keydown", function (event) {
          if (event.key === "ArrowRight") flip.flipNext("bottom");
          if (event.key === "ArrowLeft") flip.flipPrev("bottom");
        });
        paint();
      })();
    </script>
  </body>
</html>
