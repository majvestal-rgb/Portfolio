        root.appendChild(heading);
        var grid = document.createElement("div");
        grid.className = "shelf-grid";
        var count = items.length || 25;
        for (var i = 0; i < count; i++) {
          var item = items[i];
          var fig = document.createElement("figure");
          fig.className = "shelf-item" + (item && item.src ? "" : " is-empty");
          if (item && item.src) {
            var img = document.createElement("img");
            img.src = item.src;
            img.alt = item.title || "";
            fig.appendChild(img);
          }
          if (item && (item.title || item.by)) {
            var cap = document.createElement("figcaption");
            if (item.title) cap.appendChild(document.createTextNode(item.title));
            if (item.by) {
              cap.appendChild(document.createElement("br"));
              cap.appendChild(document.createElement("br"));
              cap.appendChild(document.createTextNode(item.by));
            }
            fig.appendChild(cap);
          }
          grid.appendChild(fig);
        }
        root.appendChild(grid);
