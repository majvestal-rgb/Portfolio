<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illustration – Maj Vestal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <script>
      try { localStorage.setItem("mv_aesthetic", "neo"); } catch (e) {}
    </script>
    <script src="./theme.js?v=7"></script>
    <link rel="stylesheet" href="./styles.css?v=3" />
    <link rel="stylesheet" href="./theme-neo.css?v=24" />
    <link rel="stylesheet" href="https://use.typekit.net/cyu8ase.css" />
  </head>
  <body class="neo-personal neo-shelf">
    <nav class="nav" aria-label="Leave this room">
      <a class="nav-link neo-back" href="fun.html">back to home</a>
    </nav>
    <main class="shelf" id="shelf" data-kind="Illustration"></main>
    <script>
      (function () {
        var items = [
          "assets/misc/Illustrations/2CHA_UKNOW_1smalol.gif",
          "assets/misc/Illustrations/AdamArtwork_final%28ish%29.png",
          "assets/misc/Illustrations/Artboard%2016-100.jpg",
          "assets/misc/Illustrations/Illustration2.png",
          "assets/misc/Illustrations/Illustration5.jpg",
          "assets/misc/Illustrations/JuicyCD.png",
          "assets/misc/Illustrations/Untitled_Artwork.gif",
          "assets/misc/Illustrations/alicegas.png",
          "assets/misc/Illustrations/bananabread_color%20more%20noise.png",
          "assets/misc/Illustrations/crap-100.jpg",
          "assets/misc/Illustrations/cyberunderground.png",
          "assets/misc/Illustrations/fairy2.png",
          "assets/misc/Illustrations/fairymonster.gif",
          "assets/misc/Illustrations/frogfighter.gif",
          "assets/misc/Illustrations/illo.png",
          "assets/misc/Illustrations/illo2.png",
          "assets/misc/Illustrations/pixmonshading.png",
          "assets/misc/Illustrations/slack_5.mp4"
        ];
        var root = document.getElementById("shelf");
        var heading = document.createElement("h1");
        heading.className = "shelf-title";
        heading.textContent = root.getAttribute("data-kind");
        root.appendChild(heading);
        var grid = document.createElement("div");
        grid.className = "shelf-grid";
        items.forEach(function (src) {
          var name = decodeURIComponent(src.split("/").pop().replace(/\.[^.]+$/, "")).replace(/[_]+/g, " ");
          var fig = document.createElement("figure");
          fig.className = "shelf-item";
          var media;
          if (/\.(mp4|webm|mov)$/i.test(src)) {
            media = document.createElement("video");
            media.src = src;
            media.muted = true;
            media.loop = true;
            media.autoplay = true;
            media.playsInline = true;
            media.setAttribute("playsinline", "");
          } else {
            media = document.createElement("img");
            media.src = src;
            media.alt = name;
          }
          fig.appendChild(media);
          var cap = document.createElement("figcaption");
          cap.textContent = name;
          fig.appendChild(cap);
          grid.appendChild(fig);
        });
        root.appendChild(grid);
      })();
    </script>
  </body>
</html>
